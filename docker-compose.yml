services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-faqs}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - app-network

  app:
    image: msfaqs
    build: .
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      URL_PREFIX: ${URL_PREFIX:-/api/v1/faqs}
      SEED: ${SEED:-false}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-faqs}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-public}
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
